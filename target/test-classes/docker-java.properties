# Pins the Docker Engine API version used by the Testcontainers integration tests.
#
# Docker Engine 29 removed support for API versions below 1.44. The docker-java client bundled
# with Testcontainers 1.20.4 falls back to API 1.32 when it cannot negotiate a version, and the
# daemon rejects that with HTTP 400. Testcontainers reports the rejection as
# "Could not find a valid Docker environment", which reads like a missing or misconfigured Docker
# rather than a version handshake failure - the daemon is healthy and the docker CLI works fine,
# because the CLI negotiates a supported version.
#
# This file is read from the test classpath by docker-java itself, so it applies however the build
# is launched - terminal, IDE or CI - and travels with the repository. That matters here: an
# exported DOCKER_HOST or a file in $HOME would not.
#
# This is a stopgap, and a pin breaks again whenever Docker raises its floor past the pinned
# number. The durable fix is Testcontainers 2.0.2 or later, whose docker-java negotiates the API
# version against the running daemon. Delete this file as part of that upgrade.
#
# Upstream: https://github.com/testcontainers/testcontainers-java/issues/11212
api.version=1.44
